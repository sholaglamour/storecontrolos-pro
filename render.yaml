# Render "Blueprint" — lets you deploy by pointing Render at this repo
# and clicking "New +" -> "Blueprint" instead of configuring build/start
# commands by hand in the dashboard.
services:
  - type: web
    name: storecontrolos
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
